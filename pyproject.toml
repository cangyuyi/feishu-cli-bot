[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-cli-bot"
version = "0.3.0"
description = "A local, always-on Feishu (Lark) AI assistant that runs without an open platform app. Powered by lark-cli + any OpenAI-compatible LLM via function calling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["feishu", "lark", "bot", "ai-agent", "llm", "function-calling", "automation"]
authors = [{ name = "feishu-cli-bot contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
feishu-bot = "feishu_bot.__main__:main"

[project.urls]
Homepage = "https://github.com/cangyuyi/feishu-cli-bot"
Repository = "https://github.com/cangyuyi/feishu-cli-bot"
Issues = "https://github.com/cangyuyi/feishu-cli-bot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
